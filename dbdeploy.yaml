apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  labels:
    app: db-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-app
  template:
    metadata:
      labels:
        app: db-app
    spec:
      containers:
        - name: db-app
          image: vprocontainers/vprofiledb
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: db-volume
          ports:
            - name: db-port
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: db-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "2048Mi"
              cpu: "2000m"
      volumes:
        - name: db-volume
          persistentVolumeClaim:
            claimName: db-persistent-volume-claim
      
      initContainers:
        - name: wait-for-db
          image: busybox
          command: ['rm', '-rf', '/var/lib/mysql/lost+found']
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: db-volume
