apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbDeployment
  labels:
    app: kubernetes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-app
  template:
    metadata:
      labels:
        app: kubernetes-app
    spec:
      containers:
        - name: kubernetes-app
          image: vprocontainers/vprofiledb
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: dbVolume
          ports:
            - name: dbPort
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appSecret
                  key: dbPassword
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "2048Mi"
              cpu: "2000m"
      volumes:
        - name: dbVolume
          persistentVolumeClaim:
            claimName: dbPersistentVolumeClaim
      
      initContainers:
        - name: wait-for-db
          image: busybox
          command: ['rm', '-rf', '/var/lib/mysql/lost+found']
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: dbVolume
